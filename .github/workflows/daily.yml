name: Speed and health

# When the hub asks for a check or a review (its Claude tasks push a file to requests/; the daily
# import asks every morning), daily at 05:05 UTC when GitHub's timer fires, or by hand.
on:
  schedule:
    # Three chances each morning, as GitHub's timer often skips; each run only tests sites
    # without today's results. The uptime workflow also starts one if all three are missed.
    - cron: '5 5 * * *'
    - cron: '35 5 * * *'
    - cron: '7 6 * * *'
  push:
    branches: [main]
    paths: ['requests/*.json']
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids, comma separated. Leave blank for every site.'
        required: false
        default: ''
      daily:
        description: 'true: only test sites without results today'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: speed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Note which request started this run
        run: node scripts/find-request.mjs
        env:
          EVENT: ${{ github.event_name }}
      - name: Catch up with the newest results
        run: git fetch -q origin main && git reset -q --hard origin/main
      - name: Install Lighthouse
        run: npm install --no-save --no-audit --no-fund lighthouse@13.6.0
      - name: Certificates, headers and redirects
        run: node scripts/health.mjs
      - name: Lighthouse, three runs per page and device
        run: node scripts/speed.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          EVENT: ${{ github.event_name }}
          INPUT_SITES: ${{ inputs.sites }}
          DAILY: ${{ inputs.daily }}
      - name: Screenshots and page facts, for reviews only
        run: node scripts/shots.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          EVENT: ${{ github.event_name }}
      - name: Uptime check too, in case GitHub's 5 minute timer skips
        run: node scripts/uptime.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mark the request done or failed
        if: always()
        run: node scripts/finish.mjs "${{ job.status }}"
        env:
          EVENT: ${{ github.event_name }}
      - name: Save results
        if: always()
        run: bash scripts/save.sh "Speed and health"
