name: Uptime

# Every 5 minutes, at 3, 8, 13 and so on past the hour, away from the busy top of the hour.
# GitHub may still start a scheduled run late, or skip one, when it's busy.
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # to start the morning speed check if GitHub's own timer missed it

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Catch up with the newest results
        run: git fetch -q origin main && git reset -q --hard origin/main
      - name: Check every site
        run: node scripts/uptime.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save results
        run: bash scripts/save.sh "Uptime"
      - name: Start today's speed check if it hasn't run
        if: always()
        run: node scripts/daily-kick.mjs
        env:
          GH_TOKEN: ${{ github.token }}
